[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "seoul-tei-pipeline"
version = "0.1.0"
description = "Reproducible feature engineering for Seoul's Tourism Experience Index"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.1,<3",
]

[project.optional-dependencies]
viz = [
  "matplotlib>=3.9,<4",
]
geo = [
  "geopandas>=1.0,<2",
  "pyogrio>=0.9,<1",
  "shapely>=2.0,<3",
]
dev = [
  "pytest>=8,<9",
  "ruff>=0.9,<1",
]

[project.scripts]
tei-pipeline = "tei_pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
