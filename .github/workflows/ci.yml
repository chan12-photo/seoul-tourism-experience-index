name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e ".[dev,viz]"
      - run: python -m pytest
      - run: python -m ruff check src tests scripts
      - run: python -m py_compile scripts/build_portfolio_assets.py
      - run: tei-pipeline check-public .
